    - generic [ref=e117]:
      - heading "Матч Спартак - Зенит. Суперкубок России по футболу" [level=2] [ref=e118]
      - generic [ref=e119]:
        - generic [ref=e121]:
          - heading "Дерби двух столиц в борьбе за главный футбольный трофей страны" [level=3] [ref=e122]
          - paragraph [ref=e123]: Стадион «Совкомбанк Арена», г. Нижний Новгород
          - paragraph [ref=e124]: "ФК «Спартак»: Александр Максименко, Эсекьель Барко, Илья Помазун и другие"
          - paragraph [ref=e125]: "Главный тренер: Хуан Карлос Карседо"
          - paragraph [ref=e126]: "ФК «Зенит»: Евгений Латышонок, Денис Адамов, Дуглас Сантос и другие"
          - paragraph [ref=e127]: "Главный тренер: Сергей Богданович Семак"
        - generic [ref=e130]:
          - heading "Требуется Fan ID!" [level=3] [ref=e131]:
            - strong [ref=e132]: Требуется Fan ID!
          - paragraph [ref=e133]: 18 июля 2026 года состоится ключевое событие в российском футболе – матч Суперкубка России 2026, который одновременно определяет самый сильный клуб уходящего сезона 2025/2026 и даст старт новому футбольному сезону.
          - paragraph [ref=e134]: Особый статус этой игре придает тот факт, что бороться за Суперкубок будет «Спартак» и «Зенит», давние принципиальные соперники. Уверены, что вы давно не видели матча дерби двух столиц, равного этой игре по накалу эмоций и мотивации соперников обыграть друг друга.
          - paragraph [ref=e135]: У «Зенита» сезон в РПЛ 2025/2026 сложился успешно, правда почти до финальных туров в таблице первым шел «Краснодар» и только под занавес петербуржцам удалось обойти «быков» и с отрывом в 2 очка в 11 раз в истории клуба стать чемпионом России.
          - paragraph [ref=e136]: У «Спартака» игра складывалась иначе, но все в Пути регионов они показали мощную игру и то, что Карседо совсем не напрасно применяет свои тактики. В этом сезон красно-белые сильны именно в пенальти, так что для сине-бело-голубых главное – не допустить ничьей в основное время, чтобы не рисковать победой. Ну а спартаковцам стоит сразу обозначить свои интересы решительными действиями. Смогут ли они отыграться за свое поражение в Суперкубке в 2022-м – главная интрига для всех футбольных болельщиков.
          - paragraph [ref=e137]: Как всегда, для игры такого статуса РФС выбрал одну из самых вместительных и современных арен. Не обойдется по традиции и без музыкальной части. Кто из звезд выступит на игре – интрига номер два и еще один повод успеть забронировать места на трибунах арены. Главное футбольное событие лета ждет вас!
          - heading "Билеты на матч «Спартак» - «Зенит». Суперкубок России по футболу" [level=3] [ref=e138]
          - paragraph [ref=e139]: Онлайн-сервис покупки и продажи билетов Portalbilet поможет вам с посещением спортивных и культурных мероприятий любого масштаба и формата. С нами вам не придется ехать в кассу, ведь можно заказать билет онлайн, потратив на оформление заказа всего 2-3 минуты.
          - paragraph [ref=e140]: На нашем сайте вы можете купить билеты на Суперкубок России по футболу в наличии, но учитывая интерес к этой игре, свободные болельщики разбирают с каждым часом. Спешите занять места на трибунах, пока они еще есть в наличии!
          - heading "Полезные ссылки" [level=3] [ref=e141]
