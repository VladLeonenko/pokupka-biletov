              - generic [ref=e166]:
                - paragraph [ref=e167]:
                  - text: Спектакль «Мертвые души» в Театре имени Вахтангова — новый взгляд на знакомое всем произведение школьной программы. Здесь реальность и фантазия переплетаются в захватывающем водовороте, смешиваясь в бездонной пропасти.
                  - strong [ref=e168]: Билеты на спектакль «Мертвые души»
                  - text: откроют новые грани произведения и позволят на короткий миг ощутить себя вовлеченным в его события.
                - paragraph [ref=e169]: "Удивительные события здесь начинаются еще до того, как поднимется занавес. В этом спектакле вас ждет нечто невообразимое, совсем не похожее на обычные интерпретации гоголевской комедии. Жанр спектакля называется галопадом, что означает быстрый танец с прыжками, и в нем участвуют всего два актера: народная артистка России Мария Аронова (Она) и ее сын Владислав Гандрабура (Он). Один из особых моментов в этой постановке — охватывается весь роман, показывая жизнь Чичикова с самого рождения и вплоть до момента покупки мертвых душ."
                - paragraph [ref=e170]: На сцене легкая, задорная, яркая комедия, в которой Владимир Иванов объединил вечный сюжет с современным чувством юмора.
                - paragraph [ref=e171]
                - heading "Какая цена билета на спектакль «Мертвые души» в Театре Вахтангова" [level=3] [ref=e172]
                - paragraph [ref=e173]: На нашем сайте есть удобная интерактивная схема зала, которая поможет вам быстро определить, есть ли свободные места, и узнать цены на билеты.
