<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>РАМТ — разметка мест</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f1419; color: #e8eaed; font-family: system-ui, sans-serif; }
    .bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: #1a2332; border-bottom: 1px solid #334155; }
    .bar button, .bar input, .bar select { font: inherit; font-size: 13px; }
    .bar button { padding: 4px 10px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: #e8eaed; cursor: pointer; }
    .bar button:hover { background: #475569; }
    .bar button.active { background: #2563eb; border-color: #3b82f6; }
    .bar input, .bar select { padding: 3px 6px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #e8eaed; }
    .bar input.wide { width: 140px; }
    .bar .sep { width: 1px; height: 22px; background: #475569; }
    #status { font-size: 12px; opacity: 0.85; flex: 1; min-width: 160px; }
    .viewport { position: relative; overflow: hidden; width: 100%; height: calc(100vh - 48px); background: #000; touch-action: none; cursor: crosshair; }
    .viewport.panning { cursor: grab; }
    .stage { position: absolute; left: 50%; top: 50%; transform-origin: center center; will-change: transform; }
    .stage svg { display: block; max-width: none; }
    .dots { pointer-events: none; }
    .dots circle { pointer-events: all; cursor: pointer; }
    .dots circle.bg { fill: rgba(148, 163, 184, 0.55); }
    .dots circle.labeled { fill: #22c55e; stroke: #fff; stroke-width: 1px; }
    .dots circle.manual { fill: #fbbf24; stroke: #b45309; stroke-width: 1.5px; }
    .dots circle.hl { fill: #a78bfa !important; stroke: #fff; stroke-width: 2px; }
    .dots circle.sel { fill: #22d3ee !important; stroke: #fff; stroke-width: 2px; }
    #infoPanel { position: fixed; z-index: 100; right: 12px; top: 56px; width: min(360px, calc(100vw - 24px)); padding: 12px; border-radius: 10px; background: rgba(15,23,42,.97); border: 1px solid #475569; display: none; font-size: 14px; }
    #infoPanel.visible { display: block; }
    #infoPanel .grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin-top: 8px; align-items: center; }
    #infoPanel input { width: 100%; padding: 4px 8px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #e8eaed; }
    #toast { position: fixed; z-index: 200; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 16px; border-radius: 8px; display: none; font-size: 14px; font-weight: 600; }
    #toast.ok { display: block; background: #166534; color: #ecfdf5; }
    #toast.err { display: block; background: #7f1d1d; color: #fef2f2; }
    #toast.info { display: block; background: #1e3a5f; color: #e0f2fe; }
    #paintBar { display: none; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; }
    #paintBar.open { display: flex; }
    .hint { font-size: 11px; opacity: 0.55; }
  </style>
</head>
<body>
  <div class="bar">
    <button type="button" id="zoomOut">−</button>
    <button type="button" id="zoomIn">+</button>
    <button type="button" id="zoomFit">⊡</button>
    <button type="button" id="panMode">✋</button>
    <span class="sep"></span>
    <button type="button" id="modeView" class="active">👁</button>
    <button type="button" id="modeEdit">✎</button>
    <button type="button" id="modePaint">〰</button>
    <span class="sep"></span>
    <div id="paintBar">
      <label>Коридор <input type="number" id="corridor" min="6" max="80" value="18" style="width:52px" /></label>
      <label><input type="checkbox" id="oneRow" checked /> 1 ряд</label>
      <label>Сектор <input type="text" id="paintSector" class="wide" list="sectorList" placeholder="Бельэтаж" /></label>
      <label>Ряд <input type="text" id="paintRow" placeholder="4" style="width:52px" /></label>
      <label>Место с <input type="number" id="seatFrom" value="1" style="width:52px" /></label>
      <button type="button" id="applyRow">▶ Применить ряд</button>
      <button type="button" id="clearSel">✕</button>
      <span class="hint" id="selCount">0 точек</span>
    </div>
    <datalist id="sectorList"></datalist>
    <span class="sep"></span>
    <button type="button" id="saveBtn">💾 Сохранить</button>
    <span id="status">Загрузка…</span>
  </div>
  <div class="viewport" id="viewport">
    <div class="stage" id="stage"></div>
  </div>
  <div id="infoPanel">
    <button type="button" id="closeInfo" style="float:right">✕</button>
    <strong id="infoTitle">Место</strong>
    <div class="grid">
      <span>Сектор</span><input id="fSector" />
      <span>Ряд</span><input id="fRow" />
      <span>Место</span><input id="fSeat" />
      <span>x%</span><input id="fX" readonly />
      <span>y%</span><input id="fY" readonly />
    </div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
      <button type="button" id="applyOne">Применить</button>
      <button type="button" id="clearOne">Сброс подписи</button>
    </div>
  </div>
  <div id="toast"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
    const PROD = 'https://biletvsem.com';
    const saveApiBase = (params.get('saveApi') || '').replace(/\/$/, '') || (isLocal ? PROD : '');
    const saveToken = params.get('saveToken') || params.get('token') || '';
    const apiBase = saveApiBase || '';
    function apiUrl(path) { return apiBase + '/api/tools/ramt-hall-seats' + path; }

    const viewport = document.getElementById('viewport');
    const stage = document.getElementById('stage');
    const statusEl = document.getElementById('status');
    const toastEl = document.getElementById('toast');
    const paintBar = document.getElementById('paintBar');
    const sectorList = document.getElementById('sectorList');

    let hallW = 930, hallH = 847;
    let panX = 0, panY = 0, zoom = 0.4, fitZoom = 0.4;
    let panMode = false, appMode = 'view';
    let drag = null, pointers = new Map(), pinch = null;
    /** @type {Map<string, { sector?: string, row?: string, seat?: string, manual?: boolean }>} */
    let labels = new Map();
    /** @type {{ xPct: number, yPct: number, el: SVGCircleElement }[]} */
    let dots = [];
    let selected = new Set();
    let paintPath = [];
    let paintLine = null;
    let activeCircle = null;

    function showToast(kind, msg) {
      toastEl.className = kind;
      toastEl.textContent = msg;
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { toastEl.className = ''; }, 4500);
    }
    function coordKey(x, y) { return x.toFixed(4) + '|' + y.toFixed(4); }
    function norm(s) { return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase(); }

    function applyTransform() {
      stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${zoom})`;
    }
    function clampZoom(z) { return Math.min(fitZoom * 8, Math.max(fitZoom * 0.35, z)); }
    function zoomFit() {
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      fitZoom = Math.min((vw - 20) / hallW, (vh - 20) / hallH, 1);
      zoom = fitZoom;
      panX = panY = 0;
      applyTransform();
    }
    function clientToSvg(cx, cy) {
      const vr = viewport.getBoundingClientRect();
      const sr = stage.getBoundingClientRect();
      const lx = (cx - sr.left) / sr.width * hallW;
      const ly = (cy - sr.top) / sr.height * hallH;
      return { x: lx, y: ly };
    }

    function rebuildDots() {
      dots.forEach(d => d.el.remove());
      dots = [];
      const svg = stage.querySelector('svg.dots');
      if (!svg) return;
      for (const [key, meta] of labels.entries()) {
        const [xS, yS] = key.split('|');
        const xPct = +xS, yPct = +yS;
        if (!Number.isFinite(xPct)) continue;
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', (xPct / 100 * hallW).toFixed(2));
        c.setAttribute('cy', (yPct / 100 * hallH).toFixed(2));
        c.setAttribute('r', '5');
        c.dataset.key = key;
        const has = meta.sector && meta.row && meta.seat;
        c.classList.add(has ? (meta.manual ? 'manual' : 'labeled') : 'bg');
        if (!has) c.classList.add('bg');
        c.addEventListener('pointerdown', onDotDown);
        svg.appendChild(c);
        dots.push({ xPct, yPct, el: c });
      }
      refreshSelUi();
    }

    function loadLabelsFromSeats(seats) {
      labels.clear();
      for (const s of seats) {
        const xPct = +s.xPct, yPct = +s.yPct;
        if (!Number.isFinite(xPct) || !Number.isFinite(yPct)) continue;
        labels.set(coordKey(xPct, yPct), {
          sector: s.sector, row: s.row, seat: s.seat,
          manual: String(s.geodesySource || '').includes('manual'),
        });
      }
    }

    function initBackgroundCoords(allCoords) {
      for (const pt of allCoords) {
        const xPct = +pt.xPct, yPct = +pt.yPct;
        if (!Number.isFinite(xPct) || !Number.isFinite(yPct)) continue;
        const k = coordKey(xPct, yPct);
        if (!labels.has(k)) labels.set(k, {});
      }
    }

    async function loadAll() {
      const bundleR = await fetch(apiUrl('/bundle'), { cache: 'no-store' });
      if (!bundleR.ok) throw new Error('bundle ' + bundleR.status);
      const bundle = await bundleR.json();
      hallW = bundle.hallWidth || 930;
      hallH = bundle.hallHeight || 847;
      const svgR = await fetch(bundle.svgUrl + '?_=' + Date.now(), { cache: 'no-store' });
      const svgText = await svgR.text();
      stage.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.innerHTML = svgText.trim();
      const bg = wrap.querySelector('svg');
      if (!bg) throw new Error('no svg');
      bg.setAttribute('width', hallW);
      bg.setAttribute('height', hallH);
      bg.style.display = 'block';
      stage.appendChild(bg);
      const dotsSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      dotsSvg.classList.add('dots');
      dotsSvg.setAttribute('viewBox', `0 0 ${hallW} ${hallH}`);
      dotsSvg.setAttribute('width', hallW);
      dotsSvg.setAttribute('height', hallH);
      dotsSvg.style.position = 'absolute';
      dotsSvg.style.left = '0';
      dotsSvg.style.top = '0';
      stage.style.position = 'relative';
      stage.appendChild(dotsSvg);
      loadLabelsFromSeats(bundle.seats || []);
      initBackgroundCoords(bundle.allSeatCoordinates || []);
      rebuildDots();
      sectorList.innerHTML = '';
      for (const label of bundle.sectorLabels || []) {
        const o = document.createElement('option');
        o.value = label;
        sectorList.appendChild(o);
      }
      zoomFit();
      statusEl.textContent = `Точек: ${labels.size}, подписано: ${countLabeled()} · ${bundle.title || 'РАМТ'}`;
    }

    function countLabeled() {
      let n = 0;
      for (const m of labels.values()) if (m.sector && m.row && m.seat) n++;
      return n;
    }

    function collectSeatsForSave() {
      const out = [];
      for (const [key, m] of labels.entries()) {
        if (!m.sector || !m.row || !m.seat) continue;
        const [xS, yS] = key.split('|');
        out.push({
          sector: m.sector, row: m.row, seat: m.seat,
          xPct: +xS, yPct: +yS,
          geodesySource: m.manual ? 'manual-editor' : 'pbilet-import',
        });
      }
      return out;
    }

    async function saveToServer() {
      const seats = collectSeatsForSave();
      if (!seats.length) { showToast('err', '0 подписанных мест'); return; }
      const headers = { 'Content-Type': 'application/json' };
      if (saveToken) headers['x-luzhniki-svg-save-token'] = saveToken;
      showToast('info', 'POST…');
      const r = await fetch(apiUrl(''), { method: 'POST', headers, body: JSON.stringify({ seats }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) {
        showToast('err', data.error || r.status);
        return;
      }
      showToast('ok', 'Сохранено: ' + data.labeledSeats + ' мест → checkout');
      statusEl.textContent = 'Сохранено ' + data.labeledSeats + ' мест';
    }

    function setMode(mode) {
      appMode = mode;
      document.getElementById('modeView').classList.toggle('active', mode === 'view');
      document.getElementById('modeEdit').classList.toggle('active', mode === 'edit');
      document.getElementById('modePaint').classList.toggle('active', mode === 'paint');
      paintBar.classList.toggle('open', mode === 'paint');
      clearPaint();
    }

    function onDotDown(e) {
      if (panMode) return;
      e.stopPropagation();
      const key = e.target.dataset.key;
      if (appMode === 'paint') {
        if (!e.shiftKey) selected.clear();
        if (selected.has(key)) selected.delete(key); else selected.add(key);
        refreshSelUi();
        return;
      }
      if (appMode === 'edit' || appMode === 'view') {
        activeCircle = e.target;
        openInfo(key);
      }
    }

    function openInfo(key) {
      const m = labels.get(key) || {};
      const [xS, yS] = key.split('|');
      document.getElementById('fSector').value = m.sector || '';
      document.getElementById('fRow').value = m.row || '';
      document.getElementById('fSeat').value = m.seat || '';
      document.getElementById('fX').value = xS;
      document.getElementById('fY').value = yS;
      document.getElementById('infoPanel').classList.add('visible');
      document.getElementById('infoPanel').dataset.key = key;
      dots.forEach(d => d.el.classList.toggle('hl', d.el.dataset.key === key));
    }

    function refreshSelUi() {
      document.getElementById('selCount').textContent = selected.size + ' точек';
      dots.forEach(d => d.el.classList.toggle('sel', selected.has(d.el.dataset.key)));
    }

    function clearPaint() { selected.clear(); paintPath = []; if (paintLine) paintLine.remove(); paintLine = null; refreshSelUi(); }

    function distToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      const len2 = dx * dx + dy * dy || 1;
      let t = ((px - x1) * dx + (py - y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      const nx = x1 + t * dx, ny = y1 + t * dy;
      return Math.hypot(px - nx, py - ny);
    }

    let paintShift = false;

    function selectAlongPaintPath(additive) {
      if (paintPath.length < 2) return;
      const corridor = +document.getElementById('corridor').value || 18;
      const oneRow = document.getElementById('oneRow').checked;
      const hits = [];
      for (const d of dots) {
        const sx = d.xPct / 100 * hallW, sy = d.yPct / 100 * hallH;
        let minD = Infinity;
        for (let i = 1; i < paintPath.length; i++) {
          minD = Math.min(minD, distToSegment(sx, sy, paintPath[i-1].x, paintPath[i-1].y, paintPath[i].x, paintPath[i].y));
        }
        if (minD <= corridor) hits.push({ d, minD, sy });
      }
      if (oneRow && hits.length) {
        hits.sort((a, b) => a.sy - b.sy);
        const mid = hits[Math.floor(hits.length / 2)].sy;
        const band = corridor * 0.85;
        hits.splice(0, hits.length, ...hits.filter(h => Math.abs(h.sy - mid) <= band));
      }
      hits.sort((a, b) => a.d.xPct - b.d.xPct);
      if (!additive) selected.clear();
      for (const h of hits) selected.add(h.d.el.dataset.key);
      refreshSelUi();
    }

    function applyRowToSelection() {
      const sector = document.getElementById('paintSector').value.trim();
      const row = document.getElementById('paintRow').value.trim();
      let seatN = +document.getElementById('seatFrom').value || 1;
      if (!sector || !row) { showToast('err', 'Сектор и ряд обязательны'); return; }
      if (!selected.size) { showToast('err', 'Нет выделенных точек'); return; }
      const keys = [...selected].sort((a, b) => {
        const [ax] = a.split('|').map(Number);
        const [bx] = b.split('|').map(Number);
        return ax - bx;
      });
      for (const key of keys) {
        labels.set(key, { sector, row, seat: String(seatN++), manual: true });
      }
      rebuildDots();
      showToast('ok', 'Ряд «' + row + '»: ' + keys.length + ' мест');
      clearPaint();
    }

    document.getElementById('applyOne').onclick = () => {
      const key = document.getElementById('infoPanel').dataset.key;
      if (!key) return;
      labels.set(key, {
        sector: document.getElementById('fSector').value.trim(),
        row: document.getElementById('fRow').value.trim(),
        seat: document.getElementById('fSeat').value.trim(),
        manual: true,
      });
      rebuildDots();
      showToast('ok', 'Применено');
    };
    document.getElementById('clearOne').onclick = () => {
      const key = document.getElementById('infoPanel').dataset.key;
      if (!key) return;
      labels.set(key, {});
      rebuildDots();
    };
    document.getElementById('closeInfo').onclick = () => document.getElementById('infoPanel').classList.remove('visible');
    document.getElementById('modeView').onclick = () => setMode('view');
    document.getElementById('modeEdit').onclick = () => setMode('edit');
    document.getElementById('modePaint').onclick = () => setMode('paint');
    document.getElementById('applyRow').onclick = applyRowToSelection;
    document.getElementById('clearSel').onclick = clearPaint;
    document.getElementById('saveBtn').onclick = saveToServer;
    document.getElementById('zoomIn').onclick = () => { zoom = clampZoom(zoom * 1.25); applyTransform(); };
    document.getElementById('zoomOut').onclick = () => { zoom = clampZoom(zoom / 1.25); applyTransform(); };
    document.getElementById('zoomFit').onclick = zoomFit;
    document.getElementById('panMode').onclick = () => {
      panMode = !panMode;
      document.getElementById('panMode').classList.toggle('active', panMode);
      viewport.classList.toggle('panning', panMode);
    };

    viewport.addEventListener('pointerdown', (e) => {
      if ((e.target).closest && (e.target).closest('circle')) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (appMode === 'paint' && !panMode) {
        paintShift = e.shiftKey;
        const p = clientToSvg(e.clientX, e.clientY);
        paintPath = [p];
        drag = { kind: 'paint', id: e.pointerId };
        viewport.setPointerCapture(e.pointerId);
        return;
      }
      if (panMode || e.button === 1) {
        drag = { kind: 'pan', id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: panX, oy: panY };
        viewport.setPointerCapture(e.pointerId);
      }
    });
    viewport.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (drag?.kind === 'pan' && drag.id === e.pointerId) {
        panX = drag.ox + (e.clientX - drag.sx);
        panY = drag.oy + (e.clientY - drag.sy);
        applyTransform();
      }
      if (drag?.kind === 'paint' && drag.id === e.pointerId) {
        const p = clientToSvg(e.clientX, e.clientY);
        paintPath.push(p);
        if (!paintLine) {
          paintLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          paintLine.setAttribute('stroke', '#22d3ee');
          paintLine.setAttribute('stroke-width', '3');
          stage.querySelector('svg.dots')?.appendChild(paintLine);
        }
        paintLine.setAttribute('x1', paintPath[0].x);
        paintLine.setAttribute('y1', paintPath[0].y);
        paintLine.setAttribute('x2', p.x);
        paintLine.setAttribute('y2', p.y);
      }
    });
    viewport.addEventListener('pointerup', (e) => {
      pointers.delete(e.pointerId);
      if (drag?.kind === 'paint' && drag.id === e.pointerId) {
        selectAlongPaintPath(paintShift);
        if (paintLine) { paintLine.remove(); paintLine = null; }
        paintPath = [];
      }
      drag = null;
      try { viewport.releasePointerCapture(e.pointerId); } catch (_) {}
    });

    loadAll().catch(err => {
      statusEl.textContent = 'Ошибка: ' + err.message;
      showToast('err', err.message);
    });
  </script>
</body>
</html>
